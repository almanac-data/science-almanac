notes: |
  Human-verified 2026-10-31: HTTP 200. The site renders only with JavaScript; headless Chromium shows the RePORTER search with links to FAQs, the API, and ExPORTER. The old ExPORTER URL https://report.nih.gov/exporter returned 404 to headless Chromium, so the bulk-download location should be confirmed by a steward. Two things are assumed from RePORTER's usual description and weren't checked: the weekly cadence and the inclusion of other HHS agencies' projects.
