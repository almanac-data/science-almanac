notes: |
  Human-verified 2026-10-31: HTTP 200. The page describes "an implementation of the FDSN Event Web Service Specification" for custom earthquake searches and recommends the Real-time GeoJSON Feeds for automated display. Two things come from the service's usual documentation, not this page: the output formats and the name ComCat. The catalog updates continuously; the schema has no continuous value, so cadence is recorded as daily.
