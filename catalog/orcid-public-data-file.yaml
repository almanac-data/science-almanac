title: ORCID Public Data File
description: |
  ORCID's annual snapshot of all public data in the ORCID Registry: researcher record summaries plus their public activities (works, employment, education, funding, peer review), in XML. The bulk counterpart to ORCID's public API, and the reference set of researcher identifiers.
