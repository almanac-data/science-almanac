notes: |
  Human-verified 2026-10-31: HTTP 200. The site lists DAACs (ASF, GES DISC, LP DAAC, NSIDC, ORNL, PO.DAAC, ...), APIs, the Common Metadata Repository, and Earthdata Login. NASA's Data Use and Citation Guidance (https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance) states "Unless the content is marked with a use restriction or license, data provided from a NASA-led mission are licensed as Creative Commons Zero (CC0)". Some specific NASA datasets are already cataloged in climate-almanac (nasa-gistemp, nasa-grace-land-mascons); this entry is the gateway. Three things come from Earthdata's usual practice and weren't checked here: the Earthdata Login requirement, the formats, and the daily cadence.
