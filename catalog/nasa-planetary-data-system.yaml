  Human-verified 2026-10-31: HTTP 200. The page lists recent data releases, among them "Artemis II Mission Data" (October 7, 2026) and earlier Mars Reconnaissance Orbiter, Juno, Dawn, InSight, and Odyssey releases. The archive is built on the PDS4 (and legacy PDS3) standards. API availability comes from PDS's usual search services and wasn't checked. NASA data is generally released without restriction, but no license is stated here, so the license is left unverified.
