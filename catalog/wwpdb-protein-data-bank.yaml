notes: |
  Human-verified 2026-10-31: rcsb.org returned HTTP 200, listing Download Coordinates and Experimental Data, File Download Services, and Web APIs. The wwPDB usage policy (https://www.wwpdb.org/about/usage-policies, HTTP 200) states "Data files contained in the PDB archive are available under the CC0 1.0 Universal (CC0 1.0) Public Domain Dedication" and encourages crediting the original authors. Three details come from the archive's usual description and weren't checked: the 1971 founding, the weekly release cadence, and the formats. The jurisdiction is international-ngo because wwPDB is an international consortium of data centres in the US, Europe, and Japan, not a treaty body.
