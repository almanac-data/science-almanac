id: crossref-metadata
type: dataset
title: Crossref Metadata (REST API and Public Data File)
description: |
  Metadata that Crossref members deposit for every Crossref DOI: bibliographic records for articles, books, preprints, datasets, grants and more, with references, funding, licence links, ORCID and ROR IDs, updates and retractions, and some abstracts. Open through a free REST API and an annual public data file.
