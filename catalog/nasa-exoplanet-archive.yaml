notes: |
  Human-verified 2026-10-31: HTTP 200. The page reports "6,451 Confirmed Planets" as of 10/15/2026 and lists a Table Access Protocol (TAP) interface, an API, and bulk data download. The acknowledgment page (https://exoplanetarchive.ipac.caltech.edu/docs/acknowledge.html) gives the standard acknowledgment text, used here as the attribution. It's operated by Caltech under NASA contract, so the jurisdiction is recorded as national (US). Several details come from the archive's usual practice, not from these pages: the weekly cadence and the votable/json formats. No license is stated, so none is claimed.
