  auth_note: "API works without a key but then shares a $0.10/day budget per IP address; a free account key gives $1/day of usage, with paid tiers above that. The snapshot is free to download."
  rate_limit: "Usage-priced: free key $1/day, keyless $0.10/day per IP (from the API's own notice and the pricing page)"
