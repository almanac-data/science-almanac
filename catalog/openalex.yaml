id: openalex
type: dataset
title: OpenAlex
description: |
  An open catalog of the global research system: scholarly works, authors, institutions, sources, publishers, funders and topics, linked by citations. Available through a REST API and as a free quarterly snapshot in a public S3 bucket.
publisher: OpenAlex (OurResearch)
