notes: |
  Human-verified 2026-10-31: HTTP 200. The page describes GenBank as "the NIH genetic sequence database, an annotated collection of all publicly available DNA sequences" within the INSDC, whose three partners "exchange data on a daily basis". It says "A GenBank release occurs every two months and is available from the ftp site". The schema has no bimonthly cadence, so it's recorded as irregular. Not checked here: API access (NCBI E-utilities), the 1982 start year, and reuse terms. The sequences are submitted by researchers, so the license is left unverified rather than assumed to be public domain.
